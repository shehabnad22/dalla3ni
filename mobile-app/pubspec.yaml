name: dalla3ni
description: "دلّعني - خدمة التوصيل السريع"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  url_launcher: ^6.2.1
  shared_preferences: ^2.2.2
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  http: ^1.1.0
  flutter_native_splash: ^2.3.5
  flutter_launcher_icons: ^0.13.1
  image_picker: ^1.0.4
  # Firebase (uncomment when configured)
  # firebase_core: ^2.24.2
  # firebase_messaging: ^14.7.10
  # flutter_local_notifications: ^16.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter_native_splash:
  color: "#FF6B35"
  image: assets/splash_screen.png
  android: true
  ios: true
  android_12:
    color: "#FF6B35"
    image: assets/splash_screen.png
  fullscreen: true
  android_gravity: center
  ios_content_mode: center

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FF6B35"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/

